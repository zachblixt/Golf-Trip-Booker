spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.port=8080
# Listen on every interface, not just loopback, so a phone running Expo Go can
# reach the API at your machine's LAN address.
server.address=0.0.0.0

# HS256 needs at least 32 bytes. Override in production; never commit the real one.
jwt.secret=${JWT_SECRET:golf-trip-booker-dev-secret-change-me-please-32+}
jwt.issuer=golf-trip-booker
# 12 hours. The client stores the token in expo-secure-store and refreshes on launch.
jwt.expiration-minutes=720

# Comma-separated origin patterns (wildcards allowed).
#
# The port wildcard on localhost is deliberate. Metro holds 8081, so `expo start --web`
# lands on 8082, and anything else already holding a port pushes it further along. Pinning
# exact dev ports means CORS breaks on whichever machine lost the race -- and it breaks as
# a bare "could not reach the server", which sends you off checking whether Spring is up.
#
# The private-range patterns cover Expo Go on a phone on your wifi. A native build sends no
# Origin header at all, so CORS never applies to it. That is why a phone can be working
# while a browser pointed at the same server is not.
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*

# ---- Proposal drafting ----
# Optional. With no key the app starts normally, every screen works, and the draft
# endpoint declines politely. Drafting is a convenience on top of a form a host can
# always fill in by hand, and it must never be load-bearing.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
anthropic.base-url=https://api.anthropic.com
anthropic.max-tokens=1024
# A host is waiting inside their own request. Fail cleanly rather than hang.
anthropic.timeout-seconds=30
