name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    # A throwaway MySQL for the length of this job. The 47 data-layer tests talk
    # to a real database and call set_known_good_state(), so there is nothing to
    # mock here: they need a server or they need to not run.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        # Same reasoning as compose. MySQL answers TCP long before it answers
        # queries, so the job waits on a real ping rather than on the port.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          # Caches ~/.m2 between runs, so only the first run pays for the
          # dependency tree.
          cache: maven

      - name: Load the test schema
        env:
          MYSQL_PWD: ci-root
        run: |
          if ! command -v mysql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
          fi
          # 127.0.0.1, not localhost: the mysql client treats localhost as a
          # request for a unix socket, which does not exist here.
          mysql -h 127.0.0.1 -P 3306 -u root --protocol=TCP < Server/database/test-schema.sql

      - name: Run tests
        working-directory: Server
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/golf_trip_booker_test
          DB_USERNAME: root
          DB_PASSWORD: ci-root
        run: mvn -B test

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Proves the Dockerfile still works. Nothing is pushed anywhere yet;
      # that is the delivery step, and it comes later.
      - name: Build the API image
        run: docker build -t golf-trip-booker:ci ./Server
